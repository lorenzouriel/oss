name: market-streaming

x-flink-env: &flink-env
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: flink-jobmanager
    taskmanager.numberOfTaskSlots: 4
    parallelism.default: 2
    state.backend.type: rocksdb
    execution.checkpointing.interval: 30s
    state.checkpoints.dir: s3://${FLINK_BUCKET:-flink}/checkpoints
    state.savepoints.dir: s3://${FLINK_BUCKET:-flink}/savepoints
    s3.endpoint: http://seaweedfs:8333
    s3.path.style.access: true
    s3.access-key: ${S3_ACCESS_KEY:-admin}
    s3.secret-key: ${S3_SECRET_KEY:-admin12345}
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: 9249
  ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-presto-1.20.1.jar

services:
  # ---------- Event broker ----------
  redpanda:
    image: redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "19092:19092" # Kafka API (host clients)
      - "18081:18081" # Schema Registry
      - "18082:18082" # HTTP Proxy
      - "19644:9644"  # Admin API + /public_metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-init:
    image: redpandadata/redpanda:v24.3.7
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-6}
    entrypoint: ["/bin/bash", "/init/create-topics.sh"]
    volumes:
      - ./storage/init:/init:ro
    restart: "no"

  redpanda-console:
    image: redpandadata/console:v2.8.5
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "8080:8080"

  # ---------- Stream processing ----------
  flink-jobmanager:
    image: flink:1.20.1-scala_2.12-java17
    command: jobmanager
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
    environment: *flink-env
    ports:
      - "8081:8081" # Flink Web UI / REST
    volumes:
      - ./flink/jobs:/opt/flink/jobs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  flink-taskmanager:
    image: flink:1.20.1-scala_2.12-java17
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment: *flink-env
    volumes:
      - ./flink/jobs:/opt/flink/jobs:ro

  # ---------- Storage ----------
  # S3-compatible object store (MinIO no longer publishes public images)
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-admin12345}
    entrypoint: ["/bin/sh", "/init/start-seaweedfs.sh"]
    ports:
      - "8333:8333" # S3 API
      - "8888:8888" # Filer UI (browse buckets)
      - "9333:9333" # Master UI
    volumes:
      - ./storage/init:/init:ro
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8333/status >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs-init:
    image: chrislusf/seaweedfs:3.80
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      MARKET_BUCKET: ${MARKET_BUCKET:-market-data}
      FLINK_BUCKET: ${FLINK_BUCKET:-flink}
    entrypoint: ["/bin/sh", "/init/create-buckets.sh"]
    volumes:
      - ./storage/init:/init:ro
    restart: "no"

  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market}
      POSTGRES_DB: ${POSTGRES_DB:-market}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Observability ----------
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      - prometheus
      - postgres
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_USER: ${POSTGRES_USER:-market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market}
      POSTGRES_DB: ${POSTGRES_DB:-market}
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  redpanda-data:
  seaweedfs-data:
  postgres-data:
  prometheus-data:
  grafana-data:
