global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Throughput, consumer lag, partitions, disk
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  # Records in/out, checkpoints, backpressure, restarts
  - job_name: flink
    static_configs:
      - targets: ["flink-jobmanager:9249", "flink-taskmanager:9249"]

  - job_name: seaweedfs
    static_configs:
      - targets: ["seaweedfs:9324"]

  # Replay producer: enable once it exposes /metrics
  # - job_name: producer
  #   static_configs:
  #     - targets: ["producer:8000"]
